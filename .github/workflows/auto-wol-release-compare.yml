name: AutoWOL Tizen Release-Mode Comparison

on:
  workflow_dispatch:
  push:
    branches:
      - feature/auto-wol-on-launch
    paths:
      - '.github/workflows/auto-wol-release-compare.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify source and config
        run: |
          node --check wasm/platform/index.js
          node --check wasm/static/js/utils.js
          grep -q "Launch wake request sent" wasm/platform/index.js
          grep -q 'id="MoonLightS.MoonlightWasm"' res/config.xml
      - name: Build release-mode comparison WGT
        run: |
          docker build --build-arg BUILD_TYPE=release --build-arg REPO_OWNER="${{ github.repository_owner }}" --build-arg REPO_NAME="${{ github.event.repository.name }}" --build-arg FORCE_GAME_MODE=false -t moonlight-autowol:release-compare .
      - name: Extract WGT
        run: |
          id=$(docker create moonlight-autowol:release-compare)
          docker cp "$id:/home/moonlight/Moonlight.wgt" ./Moonlight-AutoWOL-release-compare.wgt
          docker rm "$id"
      - name: Upload comparison artifact only
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-AutoWOL-release-compare
          path: Moonlight-AutoWOL-release-compare.wgt
          if-no-files-found: error
          retention-days: 7
